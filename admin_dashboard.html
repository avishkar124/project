<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Admin Dashboard | Cyber Crime Portal</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
    font-family: Arial;
    background: #f4f6f9;
}

header {
    background: #0b3c5d;
    color: white;
    padding: 15px 30px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.container {
    width: 90%;
    margin: 30px auto;
    background: white;
    padding: 20px;
    border-radius: 10px;
}

table {
    width: 100%;
    border-collapse: collapse;
}

th, td {
    padding: 10px;
    border: 1px solid #ccc;
    text-align: center;
}

th {
    background: #0b3c5d;
    color: white;
}

button {
    padding: 6px 12px;
    background: #28a745;
    color: white;
    border: none;
    cursor: pointer;
}

select {
    padding: 5px;
}
</style>
</head>

<body>

<header>
<h2>Admin Dashboard</h2>
<button onclick="logout()">Logout</button>
</header>

<div class="container">
<h3>All Complaints</h3>

<table>
<thead>
<tr>
    <th>ID</th>
    <th>Title</th>
    <th>Type</th>
    <th>Status</th>
    <th>Assign Officer</th>
</tr>
</thead>
<tbody id="complaintTable"></tbody>
</table>
</div>

<script>
// Role protection
if (localStorage.getItem("role") !== "admin") {
    window.location.href = "login.html";
}

let complaints = JSON.parse(localStorage.getItem("complaints")) || [];
let table = document.getElementById("complaintTable");

complaints.forEach((c, index) => {
    table.innerHTML += `
    <tr>
        <td>${c.id}</td>
        <td>${c.title}</td>
        <td>${c.type}</td>
        <td>${c.status}</td>
        <td>
            <select onchange="assignOfficer(${index}, this.value)">
                <option value="">Select</option>
                <option value="Officer A">Officer A</option>
                <option value="Officer B">Officer B</option>
            </select>
        </td>
    </tr>
    `;
});

function assignOfficer(index, officer) {
    complaints[index].assignedOfficer = officer;
    complaints[index].status = "Assigned";
    localStorage.setItem("complaints", JSON.stringify(complaints));
    alert("Officer assigned");
    location.reload();
}

function logout() {
    localStorage.clear();
    window.location.href = "login.html";
}
</script>

</body>
</html>
