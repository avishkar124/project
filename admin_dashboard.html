<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Admin Dashboard | Cyber Crime Portal</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
    font-family: Arial;
    background: #f4f6f9;
    margin: 0;
}

/* HEADER */
header {
    background: linear-gradient(to right, #0b3c5d, #328cc1);
    color: white;
    padding: 15px 25px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.logo-container {
    display: flex;
    align-items: center;
}

.logo {
    width: 60px;
    margin-right: 10px;
}

button {
    padding: 6px 12px;
    background: #ffffff;
    color: #0b3c5d;
    border: none;
    cursor: pointer;
    border-radius: 5px;
    font-weight: bold;
}

button:hover {
    background: #ddd;
}

/* CONTENT */
.container {
    width: 90%;
    margin: 30px auto;
    background: white;
    padding: 20px;
    border-radius: 12px;
    box-shadow: 0 6px 18px rgba(0,0,0,0.08);
}

h3 {
    color: #0b3c5d;
}

table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 15px;
}

th, td {
    padding: 10px;
    border: 1px solid #ccc;
    text-align: center;
}

th {
    background: #0b3c5d;
    color: white;
}

select {
    padding: 5px;
}
</style>
</head>

<body>

<header>
    <div class="logo-container">
        <img src="logoW.png.png" class="logo">
        <h2>Admin Dashboard</h2>
    </div>
    <div>
        <button onclick="window.location.href='manage_officers.html'">
            Manage Officers
        </button>
        <button onclick="logout()">Logout</button>
    </div>
</header>

<div class="container">
<h3>All Complaints</h3>

<table>
<thead>
<tr>
    <th>ID</th>
    <th>Title</th>
    <th>Type</th>
    <th>Status</th>
    <th>Assigned Officer</th>
</tr>
</thead>
<tbody id="complaintTable"></tbody>
</table>
</div>

<script>
// Role Protection
if (localStorage.getItem("role") !== "admin") {
    window.location.href = "login.html";
}

let complaints = JSON.parse(localStorage.getItem("complaints")) || [];
let officers = JSON.parse(localStorage.getItem("officers")) || [];
let table = document.getElementById("complaintTable");

// Load complaints
complaints.forEach((c, index) => {

    let officerOptions = officers.map(o =>
        `<option value="${o}" ${c.assignedOfficer === o ? "selected" : ""}>${o}</option>`
    ).join("");

    table.innerHTML += `
    <tr>
        <td>${c.id}</td>
        <td>${c.title}</td>
        <td>${c.type}</td>
        <td>${c.status}</td>
        <td>
            <select onchange="assignOfficer(${index}, this.value)">
                <option value="">Select</option>
                ${officerOptions}
            </select>
        </td>
    </tr>
    `;
});

// Assign officer
function assignOfficer(index, officer){
    if(officer){
        complaints[index].assignedOfficer = officer;
        complaints[index].status = "Assigned";
        localStorage.setItem("complaints", JSON.stringify(complaints));
        alert("Officer assigned successfully");
        location.reload();
    }
}

function logout(){
    localStorage.clear();
    window.location.href = "login.html";
}
</script>

</body>
</html>
