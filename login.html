<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>User Login | Cyber Crime Portal</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: linear-gradient(to right, #0b3c5d, #328cc1);
        }

        /* Header */
        header {
            background-color: #0b3c5d;
            color: white;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h2 {
            margin: 0;
        }

    .logo-container {
        display: flex;
        align-items: center;
    }

    .logo {
        width: 70px;
        height: 70px;
        margin-right: 10px;
    }

        nav a {
            color: white;
            text-decoration: none;
            margin-left: 20px;
            font-weight: bold;
        }

        /* Login Box */
        .container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 90vh;
        }

        .login-box {
            background-color: white;
            padding: 30px;
            width: 380px;
            border-radius: 10px;
            box-shadow: 0 0 15px rgba(0,0,0,0.3);
        }

        .login-box h2 {
            text-align: center;
            color: #0b3c5d;
            margin-bottom: 20px;
        }

        .login-box input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border-radius: 5px;
            border: 1px solid #ccc;
            font-size: 14px;
        }

        .login-box button {
            width: 100%;
            padding: 12px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 10px;
        }

        .login-box button:hover {
            background-color: #0056b3;
        }

        .register-link {
            text-align: center;
            margin-top: 15px;
        }

        .register-link a {
            color: #0b3c5d;
            text-decoration: none;
            font-weight: bold;
        }

        .forgot {
            text-align: right;
            font-size: 13px;
        }

        .forgot a {
            text-decoration: none;
            color: #007bff;
        }

        /* Footer */
        footer {
            background-color: #0b3c5d;
            color: white;
            text-align: center;
            padding: 10px;
        }
    </style>
</head>

<body>

    <!-- Header -->
    <header>
        <div class="logo-container">
            <img src="logoW.png.png" alt="Logo" class="logo">
            <h2>Cyber Crime Portal</h2>
        </div>
        <nav>
            <a href="index.html">Home</a>
            <a href="register.html">Register</a>
        </nav>
    </header>

    <!-- Login Form -->
    <div class="container">
        <div class="login-box">
            <h2>User Login</h2>

            <form onsubmit="return loginUser()">
                <input type="email" id="email" placeholder="Email Address" required>
                <input type="password" id="password" placeholder="Password" required>

                <div class="forgot">
                    <a href="#">Forgot Password?</a>
                </div>

                <button type="submit">Login</button>
            </form>

            <div class="register-link">
                New user? <a href="register.html">Create an account</a>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer>
        <p>© 2026 Cyber Crime Complaint Management System</p>
    </footer>

    
    <script>
    function loginUser() {

    let email = document.getElementById("email").value.trim();
    let password = document.getElementById("password").value.trim();

    if (email === "" || password === "") {
        document.getElementById("error").innerText = "All fields required";
        return false;
    }

    // Simulated login
    localStorage.setItem("isLoggedIn", "true");

    // Role assignment (demo)
    if (email === "admin@ccms.com") {
        localStorage.setItem("role", "admin");
        window.location.href = "admin_dashboard.html";
    } 
    else if (email === "officerA@ccms.com") {
        localStorage.setItem("role", "officer");
        localStorage.setItem("officerName", "Officer A");
        window.location.href = "officer_dashboard.html";
    } 
    else if (email === "officerB@ccms.com") {
        localStorage.setItem("role", "officer");
        localStorage.setItem("officerName", "Officer B");
        window.location.href = "officer_dashboard.html";
    } 
    else {
        localStorage.setItem("role", "user");
        window.location.href = "dashboard.html";
    }

    return false;
}
</script>


</body>
</html>
