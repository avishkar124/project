<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Officer Dashboard | Cyber Crime Portal</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
    font-family: Arial;
    background: #f4f6f9;
}

header {
    background: #0b3c5d;
    color: white;
    padding: 15px 30px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.logo-container {
        display: flex;
        align-items: center;
}

.logo {
    width: 70px;
    height: 70px;
    margin-right: 10px;
}

.container {
    width: 90%;
    margin: 30px auto;
    background: white;
    padding: 20px;
    border-radius: 10px;
}

table {
    width: 100%;
    border-collapse: collapse;
}

th, td {
    padding: 10px;
    border: 1px solid #ccc;
    text-align: center;
}

th {
    background: #0b3c5d;
    color: white;
}

select {
    padding: 5px;
}
</style>
</head>

<body>

<header>
<div class="logo-container">
    <img src="logoW.png.png" alt="Logo" class="logo">
    <h2>Cyber Crime Portal</h2>
</div>
<button onclick="logout()">Logout</button>
</header>

<div class="container">
<h3>Assigned Complaints</h3>

<table>
<thead>
<tr>
    <th>ID</th>
    <th>Title</th>
    <th>Status</th>
    <th>Update Status</th>
</tr>
</thead>
<tbody id="officerTable"></tbody>
</table>
</div>

<script>
// Role protection
if (localStorage.getItem("role") !== "officer") {
    window.location.href = "login.html";
}

// let complaints = JSON.parse(localStorage.getItem("complaints")) || [];
// let table = document.getElementById("officerTable");

// complaints
// .filter(c => c.assignedOfficer)
// .forEach((c, index) => {
//     table.innerHTML += `
//     <tr>
//         <td>${c.id}</td>
//         <td>${c.title}</td>
//         <td>${c.status}</td>
//         <td>
//             <select onchange="updateStatus('${c.id}', this.value)">
//                 <option value="">Select</option>
//                 <option>In Review</option>
//                 <option>Resolved</option>
//             </select>
//         </td>
//     </tr>
//     `;
// });

let officerName = localStorage.getItem("officerName");

let complaints = JSON.parse(localStorage.getItem("complaints")) || [];
let table = document.getElementById("officerTable");

complaints
.filter(c => c.assignedOfficer === officerName)
.forEach(c => {
    table.innerHTML += `
    <tr>
        <td>${c.id}</td>
        <td>${c.title}</td>
        <td>${c.status}</td>
        <td>
            <select onchange="updateStatus('${c.id}', this.value)">
                <option value="">Select</option>
                <option>In Review</option>
                <option>Resolved</option>
            </select>
        </td>
    </tr>
    `;
});


function updateStatus(id, status) {
    let complaints = JSON.parse(localStorage.getItem("complaints")) || [];
    let c = complaints.find(x => x.id === id);
    c.status = status;
    localStorage.setItem("complaints", JSON.stringify(complaints));
    alert("Status updated");
    location.reload();
}

function logout() {
    localStorage.clear();
    window.location.href = "login.html";
}
</script>

</body>
</html>
