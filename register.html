<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>User Registration | Cyber Crime Portal</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

/* COLOR SYSTEM */
:root {
    --primary: #0b3c5d;
    --secondary: #328cc1;
    --accent: #ffc107;
    --success: #28a745;
    --bg: #f4f6f9;
    --text: #333;
}

/* GLOBAL */
body {
    margin: 0;
    font-family: 'Segoe UI', Tahoma, sans-serif;
    background: linear-gradient(rgba(11,60,93,0.85), rgba(50,140,193,0.85)),
                url("Cyber3.jpg") center/cover no-repeat;
    color: var(--text);
}

/* HEADER */
header {
    background: transparent;
    padding: 8px 30px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    color: white;
    text-shadow: 0 1px 3px rgba(0,0,0,0.6);
}

.logo-container {
    display: flex;
    align-items: center;
}

.logo {
    width: 45px;
    margin-right: 8px;
}

.logo-container h2 {
    margin: 0;
    font-size: 20px;
}

/* NAV */
nav a {
    color: white;
    text-decoration: none;
    margin-left: 20px;
    font-weight: 600;
    position: relative;
}

nav a::after {
    content: "";
    width: 0%;
    height: 2px;
    background: var(--accent);
    position: absolute;
    left: 0;
    bottom: -4px;
    transition: 0.3s;
}

nav a:hover::after { width: 100%; }

/* CONTAINER */
.container {
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 88vh;
    padding: 20px;
}

/* REGISTER CARD */
.register-box {
    background: white;
    padding: 35px;
    width: 400px;
    border-radius: 15px;
    box-shadow: 0 15px 40px rgba(0,0,0,0.3);
    border-left: 6px solid var(--secondary);
    animation: fadeIn 0.6s ease;
    position: relative;
}

.register-box::before {
    content: "";
    position: absolute;
    top: 0;
    right: 0;
    width: 120px;
    height: 120px;
    background: radial-gradient(circle, rgba(50,140,193,0.08), transparent 70%);
    border-top-right-radius: 15px;
}

.register-box::after {
    content: "SECURE REGISTRATION";
    position: absolute;
    top: -12px;
    left: 20px;
    background: var(--secondary);
    color: white;
    font-size: 11px;
    padding: 4px 10px;
    border-radius: 20px;
    letter-spacing: 1px;
}

.register-box h2 {
    text-align: center;
    color: var(--primary);
    margin-bottom: 20px;
    position: relative;
}

.register-box h2::after {
    content: "";
    display: block;
    width: 60px;
    height: 3px;
    background: var(--accent);
    margin: 8px auto 0;
    border-radius: 2px;
}

/* INPUT GROUP WITH ICON */
.input-group {
    position: relative;
    width: 100%;
}

.input-group span {
    position: absolute;
    left: 10px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 16px;
    opacity: 0.7;
}

/* INPUTS */
.register-box input {
    width: 100%;
    padding: 12px 12px 12px 34px;
    margin-top: 12px;
    border-radius: 8px;
    border: 1px solid #ccc;
    font-size: 14px;
    transition: 0.3s;
    box-sizing: border-box; /* ✅ FIX */
}

.register-box input:focus {
    border-color: var(--secondary);
    outline: none;
    box-shadow: 0 0 8px rgba(50,140,193,0.6);
}

/* ERROR TEXT */
.error {
    color: red;
    font-size: 12px;
    margin-top: 3px;
}

/* BUTTON */
.register-box button {
    width: 100%;
    padding: 12px;
    background: linear-gradient(to right, var(--success), #1e7e34);
    color: white;
    border: none;
    border-radius: 25px;
    font-size: 16px;
    margin-top: 18px;
    cursor: pointer;
    font-weight: 600;
    transition: 0.3s;
    letter-spacing: 0.5px;
}

.register-box button:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 20px rgba(0,0,0,0.3);
}

/* FOOTER */
footer {
    background: transparent;
    color: white;
    text-align: center;
    padding: 12px;
    font-size: 13px;
}

@keyframes fadeIn {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
}

</style>
</head>

<body>

<header>
    <div class="logo-container">
        <img src="logoW.png.png" alt="Logo" class="logo">
        <h2>Cyber Crime Portal</h2>
    </div>
    <nav>
        <a href="index.html">Home</a>
        <a href="login.html">Login</a>
    </nav>
</header>

<div class="container">
<div class="register-box">

<h2>New User Registration</h2>

<form onsubmit="return validateForm()">

<div class="input-group">
<span>👤</span>
<input type="text" id="name" placeholder="Full Name" required pattern="[A-Za-z ]+">
</div>
<div id="nameError" class="error"></div>

<div class="input-group">
<span>📧</span>
<input type="email" id="email" placeholder="Email Address" required>
</div>
<div id="emailError" class="error"></div>

<div class="input-group">
<span>📱</span>
<input type="text" id="phone" placeholder="Phone Number" required pattern="[0-9]{10}">
</div>
<div id="phoneError" class="error"></div>

<div class="input-group">
<span>🔒</span>
<input type="password" id="password" placeholder="Create Password" required minlength="6">
</div>
<div id="passwordError" class="error"></div>

<div class="input-group">
<span>🔑</span>
<input type="password" id="confirmPassword" placeholder="Confirm Password" required>
</div>
<div id="confirmError" class="error"></div>

<button type="submit">Register</button>

</form>

</div>
</div>

<footer>
<p>© 2026 Cyber Crime Complaint Management System</p>
</footer>

<script>
function validateForm() {

    let valid = true;

    document.querySelectorAll(".error").forEach(e => e.innerText = "");

    let name = document.getElementById("name").value.trim();
    let email = document.getElementById("email").value.trim();
    let phone = document.getElementById("phone").value.trim();
    let password = document.getElementById("password").value;
    let confirm = document.getElementById("confirmPassword").value;

    if (!/^[A-Za-z ]+$/.test(name)) {
        document.getElementById("nameError").innerText = "Only alphabets allowed";
        valid = false;
    }

    if (!email.includes("@")) {
        document.getElementById("emailError").innerText = "Enter valid email";
        valid = false;
    }

    if (!/^\d{10}$/.test(phone)) {
        document.getElementById("phoneError").innerText = "Enter 10-digit phone number";
        valid = false;
    }

    if (password.length < 6) {
        document.getElementById("passwordError").innerText = "Minimum 6 characters required";
        valid = false;
    }

    if (password !== confirm) {
        document.getElementById("confirmError").innerText = "Passwords do not match";
        valid = false;
    }

    if (valid) {
        window.location.href = "login.html";
    }

    return false;
}
</script>

</body>
</html>
