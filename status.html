
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Complaint Status</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
html, body {
    height: 100%;
    margin: 0;
    font-family: Arial, sans-serif;
}

/* FULL PAGE BACKGROUND */
body {
    min-height: 100vh;
    background: linear-gradient(rgba(11,60,93,0.85), rgba(11,60,93,0.85)),
                url('cyber3.jpg') no-repeat center center fixed;
    background-size: cover;
    color: #333;
}

/* HEADER */
header {
    background: transparent;
    color: white;
    padding: 10px 30px;
    display: flex;
    align-items: center;
    text-shadow: 0 1px 3px rgba(0,0,0,0.6);
}

.logo-container {
    display: flex;
    align-items: center;
}
.home-btn {
    padding: 4px 12px;
    font-size: 13px;
    background: white;
     color: #0b3c5d;
    border: none;
    border-radius: 4px;
    cursor: pointer;
    font-weight: 600;
    width: auto;              /* important */
    min-width: 70px;          /* optional small fixed width */
}

.home-btn:hover {
     background: #e3f2fd;
}

.logo {
    width: 55px;
    height: 55px;
    margin-right: 10px;
}

/* CARD CONTAINER */
.container {
    width: 720px;
    margin: 60px auto;
    background: white;
    padding: 30px;
    border-radius: 15px;
    box-shadow: 0 15px 40px rgba(0,0,0,0.3);
    border-left: 6px solid #328cc1;
    animation: fadeIn 0.5s ease;
}

/* HEADING */
h2 {
    text-align: center;
    color: #0b3c5d;
    margin-bottom: 10px;
}

h2::after {
    content: "";
    display: block;
    width: 70px;
    height: 3px;
    background: #ffc107;
    margin: 8px auto 0;
    border-radius: 2px;
}

/* TABLE */
table {
    width: 100%;
    border-collapse: collapse;
    border-radius: 12px;
    overflow: hidden;
}

/* HEADER CELLS */
th {
    background: #0b3c5d;
    color: white;
    padding: 14px 10px;
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 0.5px;

    text-align: center;        /* horizontal center */
    vertical-align: middle;    /* vertical center */
    border-right: 2px solid #ffffff33;
}

th:last-child {
    border-right: none;
}

/* DATA CELLS */
td {
    padding: 14px 10px;
    border-bottom: 1px solid #eee;
    font-size: 14px;

    text-align: center;        /* horizontal center */
    vertical-align: middle;    /* vertical center */
}

/* STRIPED ROWS */
tr:nth-child(even) {
    background: #f8fbff;
}

tr:hover {
    background: #eaf4ff;
}

/* STATUS TEXT STYLE */
td:nth-child(3) {
    font-weight: 600;
    color: #0b3c5d;
}

/* DROPDOWN CENTER */
td select {
    display: block;
    margin: auto;
}

.no-data {
    text-align: center;
    color: gray;
    padding: 15px;
}

/* ANIMATION */
@keyframes fadeIn {
    from { opacity: 0; transform: translateY(15px); }
    to { opacity: 1; transform: translateY(0); }
}
</style>
</head>

<body>

<header style="justify-content: space-between;">
    <div class="logo-container">
        <img src="logoW.png.png" alt="Logo" class="logo">
        <h3>Cyber Crime Portal</h3>
    </div>

    <button onclick="window.location.href='dashboard.html'" class="home-btn">
        Home
    </button>
</header>

<div class="container">
    <h2>Complaint Status</h2>

    <table>
        <thead>
            <tr>
                <th>Complaint ID</th>
                <th>Title</th>
                <th>Type</th>
                <th>Date</th>
                <th>Status</th>
            </tr>
        </thead>
        <tbody id="statusTable">
            <!-- Complaints will be loaded here -->
        </tbody>
    </table>
</div>

<script>
if (localStorage.getItem("isLoggedIn") !== "true") {
    window.location.href = "login.html";
}

let complaints = JSON.parse(localStorage.getItem("complaints")) || [];
let tableBody = document.getElementById("statusTable");

if (complaints.length === 0) {
    tableBody.innerHTML = `
        <tr>
            <td colspan="5" class="no-data">No complaints found</td>
        </tr>
    `;
} else {
    complaints.forEach(c => {
        tableBody.innerHTML += `
            <tr>
                <td>${c.id}</td>
                <td>${c.title}</td>
                <td>${c.type}</td>
                <td>${c.date}</td>
                <td class="pending">${c.status}</td>
            </tr>
        `;
    });
}
</script>

</body>
</html>
