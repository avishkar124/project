<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>User Profile</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
    font-family: 'Segoe UI', Tahoma, sans-serif;
    background: #f4f6f9;
    margin: 0;
}

/* HEADER */
header {
    background: linear-gradient(to right, #0b3c5d, #328cc1);
    color: white;
    padding: 12px 18px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.header-left {
    display: flex;
    align-items: center;
    gap: 10px;
}

.header-left img {
    width: 40px;
}

.portal-title {
    font-size: 20px;
    font-weight: bold;
}

.header-buttons button {
    margin-left: 10px;
}

/* PROFILE HEADING */
.page-title {
    text-align: center;
    margin-top: 30px;
    font-size: 24px;
    font-weight: bold;
    color: #0b3c5d;
}

/* CARD */
.container {
    max-width: 520px;
    background: white;
    margin: 25px auto 40px;
    padding: 30px 25px;
    border-radius: 14px;
    box-shadow: 0 8px 22px rgba(0,0,0,0.12);
    text-align: center;
}

.profile-icon {
    width: 85px;
    margin-bottom: 15px;
}

/* INFO TEXT */
.info {
    text-align: left;
    margin-top: 15px;
}

.info p {
    font-size: 15px;
    margin: 12px 0;
}

.info b {
    color: #0b3c5d;
}

/* BUTTONS */
button {
    padding: 10px 16px;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    color: white;
    font-size: 14px;
}

.home-btn { background: #28a745; }
.edit-btn { background: #ffc107; color: black; }
.pass-btn { background: #17a2b8; }
.logout-btn { background: #dc3545; }

.button-group {
    margin-top: 20px;
}
</style>
</head>

<body>

<header>
    <div class="header-left">
        <img src="logo.png" alt="Logo" style="width:40px;">
        <span class="portal-title">Cyber Crime Portal</span>
    </div>

    <div>
        <button class="home-btn" onclick="location.href='dashboard.html'">Home</button>
        <button class="logout-btn" onclick="logout()">Logout</button>
    </div>
</header>
<h2 class="page-title">User Profile</h2>

<div class="container">

    <img src="profile_icon.png" class="profile-icon" alt="Profile Icon">

    <div class="info">
        <p><b>Name:</b> <span id="name"></span></p>
        <p><b>Email:</b> <span id="email"></span></p>
        <p><b>Mobile No.:</b> <span id="phone"></span></p>
    </div>

    <div class="button-group">
        <button class="edit-btn" onclick="location.href='edit_profile.html'">Edit Profile</button>
        <button class="pass-btn" onclick="location.href='change_password.html'">Change Password</button>
    </div>

</div>

<script>
let user = JSON.parse(localStorage.getItem("user"));

if (!user) {
    alert("Please login again");
    window.location.href = "login.html";
}

document.getElementById("name").innerText = user.name;
document.getElementById("email").innerText = user.email;
document.getElementById("phone").innerText = user.phone;

function logout() {
    localStorage.removeItem("isLoggedIn");
    localStorage.removeItem("user");
    window.location.href = "login.html";
}
</script>

</body>
</html>
