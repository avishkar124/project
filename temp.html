<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Complaint Status</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
html, body {
    height: 100%;
    margin: 0;
    font-family: Arial, sans-serif;
}

/* FULL PAGE BACKGROUND */
body {
    min-height: 100vh;
    background: linear-gradient(rgba(11,60,93,0.85), rgba(11,60,93,0.85)),
                url('Cyber3.jpeg') no-repeat center center fixed;
    background-size: cover;
    color: #333;
}

/* HEADER */
header {
    background: transparent;
    color: white;
    padding: 10px 30px;
    display: flex;
    align-items: center;
    text-shadow: 0 1px 3px rgba(0,0,0,0.6);
}

.logo-container {
    display: flex;
    align-items: center;
}

.logo {
    width: 55px;
    height: 55px;
    margin-right: 10px;
}

/* CARD CONTAINER */
.container {
    width: 720px;
    margin: 60px auto;
    background: white;
    padding: 30px;
    border-radius: 15px;
    box-shadow: 0 15px 40px rgba(0,0,0,0.3);
    border-left: 6px solid #328cc1;
    animation: fadeIn 0.5s ease;
}

/* HEADING */
h2 {
    text-align: center;
    color: #0b3c5d;
    margin-bottom: 10px;
}

h2::after {
    content: "";
    display: block;
    width: 70px;
    height: 3px;
    background: #ffc107;
    margin: 8px auto 0;
    border-radius: 2px;
}

/* TABLE */
table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 25px;
    border-radius: 10px;
    overflow: hidden;
}

th {
    background: linear-gradient(to right, #0b3c5d, #328cc1);
    color: white;
    padding: 12px;
    font-weight: 600;
}

td {
    padding: 12px;
    text-align: center;
    border-bottom: 1px solid #eee;
    vertical-align: middle;
}

th, td {
    padding: 12px;
    text-align: center;
    vertical-align: middle;
}




tr:nth-child(even) {
    background-color: #f8f9fb;
}

tr:hover {
    background-color: #eef5ff;
    transition: 0.2s;
}

/* STATUS BADGE */
.pending {
    color: #0b3c5d;
    font-weight: 600;
    text-align: center;
}




.no-data {
    text-align: center;
    color: gray;
    padding: 15px;
}

/* ANIMATION */
@keyframes fadeIn {
    from { opacity: 0; transform: translateY(15px); }
    to { opacity: 1; transform: translateY(0); }
}
</style>
</head>

<body>

<header>
    <div class="logo-container">
        <img src="logoW.png.png" alt="Logo" class="logo">
        <h3>Cyber Crime Portal</h3>
    </div>
</header>

<div class="container">
    <h2>Complaint Status</h2>

    <table>
        <thead>
            <tr>
                <th>Complaint ID</th>
                <th>Title</th>
                <th>Type</th>
                <th>Date</th>
                <th>Status</th>
            </tr>
        </thead>
        <tbody id="statusTable">
            <!-- Complaints will be loaded here -->
        </tbody>
    </table>
</div>

<script>
if (localStorage.getItem("isLoggedIn") !== "true") {
    window.location.href = "login.html";
}

let complaints = JSON.parse(localStorage.getItem("complaints")) || [];
let tableBody = document.getElementById("statusTable");

if (complaints.length === 0) {
    tableBody.innerHTML = `
        <tr>
            <td colspan="5" class="no-data">No complaints found</td>
        </tr>
    `;
} else {
    complaints.forEach(c => {
        tableBody.innerHTML += `
            <tr>
                <td>${c.id}</td>
                <td>${c.title}</td>
                <td>${c.type}</td>
                <td>${c.date}</td>
                <td class="pending">${c.status}</td>
            </tr>
        `;
    });
}
</script>

</body>
</html>
