<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Register Complaint</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>

    body {
        font-family: Arial;
        background: linear-gradient(rgba(11,60,93,0.85), rgba(11,60,93,0.85)),
                    url("cyber3.jpg");
        background-size: cover;
        background-position: center;
        margin: 0;
    }

    header {
        padding: 15px 40px;
    }

    .logo-container {
        display: flex;
        align-items: center;
        color: white;
    }

    .logo {
        width: 55px;
        height: 55px;
        margin-right: 12px;
    }

    header h2 {
        margin: 0;
        font-size: 22px;
        font-weight: bold;
        color: white;
    }
 .home-btn {
    padding: 4px 12px;
    font-size: 13px;
    background: white;
     color: #0b3c5d;
    border: none;
    border-radius: 4px;
    cursor: pointer;
    font-weight: 600;
    width: auto;              /* important */
    min-width: 70px;          /* optional small fixed width */
}

.home-btn:hover {
     background: #e3f2fd;
}



    .container {
        width: 720px;
        margin: 60px auto;
        background: white;
        padding: 30px;
        border-radius: 15px;
        box-shadow: 0 10px 25px rgba(0,0,0,0.25);
    }

    .container h2 {
        text-align: center;
        color: #0b3c5d;
        margin-bottom: 25px;
    }

    label {
        font-weight: bold;
        margin-top: 12px;
        display: block;
        color: #333;
    }

    input, select, textarea {
        width: 100%;
        padding: 11px;
        margin-top: 6px;
        border-radius: 6px;
        border: 1px solid #ccc;
        font-size: 14px;
        transition: 0.3s;
        box-sizing: border-box;
    }

    input:focus, select:focus, textarea:focus {
        border-color: #0b3c5d;
        outline: none;
        box-shadow: 0 0 4px rgba(11,60,93,0.3);
    }

    textarea {
        resize: none;
    }

    small {
        color: gray;
        font-size: 12px;
    }

    button {
        margin-top: 22px;
        width: 100%;
        padding: 12px;
        background: linear-gradient(to right, #dc3545, #c82333);
        color: white;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        font-size: 16px;
        font-weight: bold;
        transition: 0.3s;
    }

    button:hover {
        transform: translateY(-1px);
        box-shadow: 0 5px 12px rgba(0,0,0,0.2);
    }

    @media (max-width: 520px) {
        .container {
            width: 92%;
            margin: 20px auto;
        }
    }

    </style>
</head>

<body>

<header style="display:flex; justify-content: space-between; align-items:center;">
        <div class="logo-container">
        <img src="logoW.png.png" alt="Logo" class="logo">
        <h2>Cyber Crime Portal</h2>
    </div>

    <button onclick="window.location.href='dashboard.html'" class="home-btn">
        Home
    </button>
</header>

<div class="container">
    <h2>Cyber Crime Complaint Registration</h2>

    <label for="title">Complaint Title</label>
    <input type="text" id="title" placeholder="Enter complaint title">

    <label for="type">Type of Cyber Crime</label>
    <select id="type">
        <option value="">-- Select Crime Type --</option>
        <option>Phishing</option>
        <option>Online Fraud</option>
        <option>Identity Theft</option>
        <option>Cyber Bullying</option>
        <option>Hacking</option>
    </select>

    <label for="description">Incident Description</label>
    <textarea id="description" rows="4" placeholder="Describe the incident"></textarea>

    <label for="date">Date of Incident</label>
    <input type="date" id="date">

    <label for="evidence">Upload Evidence (Images / PDF / Video)</label>
    <input type="file" 
           id="evidence" 
           multiple 
           accept=".jpg,.jpeg,.png,.pdf,.mp4,.mov,.avi">
    <small>Accepted formats: JPG, PNG, PDF, MP4, MOV, AVI</small>

    <button onclick="submitComplaint()">Submit Complaint</button>
</div>

<script>
    if (localStorage.getItem("isLoggedIn") !== "true") {
    window.location.href = "login.html";
}

function submitComplaint() {

    let title = document.getElementById("title").value.trim();
    let description = document.getElementById("description").value.trim();
    let date = document.getElementById("date").value;
    let type = document.getElementById("type").value;
    let evidence = document.getElementById("evidence").files;

    if (title.length < 5) {
        alert("Complaint title must be at least 5 characters");
        return;
    }

    if (description.length < 20) {
        alert("Description must be at least 20 characters");
        return;
    }

    let selectedDate = new Date(date);
    let today = new Date();
    if (selectedDate > today) {
        alert("Future date not allowed");
        return;
    }

    if (evidence.length === 0) {
        alert("Upload at least one evidence file");
        return;
    }

    let files = [];
    for (let i = 0; i < evidence.length; i++) {
        files.push(evidence[i].name);
    }

    let complaint = {
        id: "CC" + Date.now(),
        title,
        type,
        description,
        date,
        evidences: files,
        status: "Pending"
    };

    let complaints = JSON.parse(localStorage.getItem("complaints")) || [];
    complaints.push(complaint);
    localStorage.setItem("complaints", JSON.stringify(complaints));

    alert("Complaint Registered Successfully!");
    window.location.href = "status.html";
}
</script>

</body>
</html>
