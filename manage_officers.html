<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Manage Officers | Cyber Crime Portal</title>

<style>
body {
    font-family: Arial;
    background: #f4f6f9;
    margin: 0;
}

/* HEADER */
header {
    background: linear-gradient(to right, #0b3c5d, #328cc1);
    color: white;
    padding: 15px 25px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.logo-container {
    display: flex;
    align-items: center;
}

.logo {
    width: 60px;
    margin-right: 10px;
}

button {
    padding: 6px 12px;
    background: #ffffff;
    color: #0b3c5d;
    border: none;
    cursor: pointer;
    border-radius: 5px;
    font-weight: bold;
}

button:hover {
    background: #ddd;
}

.container {
    width: 80%;
    margin: 30px auto;
    background: white;
    padding: 20px;
    border-radius: 12px;
    box-shadow: 0 6px 18px rgba(0,0,0,0.08);
}

input {
    padding: 8px;
    margin-right: 10px;
}

table {
    width: 100%;
    margin-top: 20px;
    border-collapse: collapse;
}

th, td {
    border: 1px solid #ccc;
    padding: 10px;
    text-align: center;
}

th {
    background: #0b3c5d;
    color: white;
}
</style>
</head>

<body>

<header>
    <div class="logo-container">
        <img src="logoW.png.png" class="logo">
        <h2>Manage Officers</h2>
    </div>
    <button onclick="window.location.href='admin_dashboard.html'">
        Back to Dashboard
    </button>
</header>

<div class="container">

<input type="text" id="officerName" placeholder="Enter Officer Name">
<button onclick="addOfficer()">Add Officer</button>

<table>
<thead>
<tr>
    <th>Officer Name</th>
    <th>Action</th>
</tr>
</thead>
<tbody id="officerTable"></tbody>
</table>

</div>

<script>
if (localStorage.getItem("role") !== "admin") {
    window.location.href = "login.html";
}

let officers = JSON.parse(localStorage.getItem("officers")) || [];
let table = document.getElementById("officerTable");

function loadOfficers(){
    table.innerHTML = "";
    officers.forEach((o, index) => {
        table.innerHTML += `
        <tr>
            <td>${o}</td>
            <td>
                <button onclick="deleteOfficer(${index})">Delete</button>
            </td>
        </tr>`;
    });
}

function addOfficer(){
    let name = document.getElementById("officerName").value.trim();
    if(name){
        officers.push(name);
        localStorage.setItem("officers", JSON.stringify(officers));
        document.getElementById("officerName").value = "";
        loadOfficers();
    }
}

function deleteOfficer(index){
    officers.splice(index,1);
    localStorage.setItem("officers", JSON.stringify(officers));
    loadOfficers();
}

loadOfficers();
</script>

</body>
</html>
